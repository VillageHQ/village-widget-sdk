# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_FRONTEND_URL: ${{ secrets.VITE_APP_FRONTEND_URL }}
          VITE_APP_POSTHOG_HOST: ${{ secrets.VITE_APP_POSTHOG_HOST }}
          VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
        run: npx tsx scripts/validate-env.ts

      - name: Run bundle syntax check
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_FRONTEND_URL: ${{ secrets.VITE_APP_FRONTEND_URL }}
          VITE_APP_POSTHOG_HOST: ${{ secrets.VITE_APP_POSTHOG_HOST }}
          VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
        run: npm run check:bundle

      - name: Run test suite
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_FRONTEND_URL: ${{ secrets.VITE_APP_FRONTEND_URL }}
          VITE_APP_POSTHOG_HOST: ${{ secrets.VITE_APP_POSTHOG_HOST }}
          VITE_APP_POSTHOG_KEY: ${{ secrets.VITE_APP_POSTHOG_KEY }}
        run: npm test
